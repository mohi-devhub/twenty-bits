[project]
name = "twenty-bits"
version = "0.1.0"
description = "Exact table-search games and information-seeking measurements"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "huggingface-hub==0.36.2",
  "threadpoolctl==3.6.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
replay = ["playwright==1.58.0"]
paid = [
  "tinker==0.39.1",
  "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@6c081121b90dbc290b4550eb9fd9f646f8e4960a",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twenty_bits*"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/test_paid_adapter.py" = ["E402"]
