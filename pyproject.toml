[project]
name = "twenty-bits"
version = "0.1.0"
description = "Exact table-search games and information-seeking measurements"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6",
  "transformers==4.57.6",
  "tokenizers==0.22.2",
  "huggingface-hub==0.36.2",
  "threadpoolctl==3.6.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
replay = ["playwright==1.58.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["twenty_bits*"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
